name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build APK with Android Components
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 29
        target: default
        arch: x86_64
        disable-animations: true
        force-avd-creation: false
        constructor: echo "Skipping emulator"

    - name: Compile and Build Debug APK
      run: |
        export SDK_URL="https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip"
        wget -q $SDK_URL -O sdk.zip
        unzip -q sdk.zip -d android-sdk
        mkdir -p android-sdk/cmdline-tools/latest
        mv android-sdk/cmdline-tools/* android-sdk/cmdline-tools/latest/ 2>/dev/null || true
        export ANDROID_HOME=$PWD/android-sdk
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "platforms;android-33" "build-tools;33.0.2" > /dev/null
        
        # إنشاء ملفات التكوين التلقائية للبناء السريع
        echo "sdk.dir=$PWD/android-sdk" > local.properties
        
        # استخدام أوامر الأندرويد المباشرة للبناء
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
        
        # في حال عدم وجود ملف gradlew، سنقوم بتوليده بمرونة
        gradle wrapper --gradle-version 8.0 || true
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        
